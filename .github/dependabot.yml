version: 2
updates:
  # Python runtime dependencies for the Lambda / tools.
  - package-ecosystem: pip
    directory: /agent/lambda
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"

  # Keep the GitHub Actions used in workflows up to date (and patched).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
