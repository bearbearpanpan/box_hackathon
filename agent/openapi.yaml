openapi: 3.0.1
info:
  title: Reality Check Agent Tools
  version: "1.0.0"
  description: >
    Action group for the Reality Check Bedrock agent. Lets the agent draft
    tech-sales contracts, raise risks against historical deal data, run deep
    research on features to offer, and produce a full risk report with a Box
    review task.
paths:
  /draft-contract:
    post:
      operationId: draftContract
      summary: Draft a new tech-sales contract from deal parameters.
      description: >
        Assemble a normalized draft deal and a readable contract body. Omitted
        fields are defaulted and reported in `assumptions`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftParams"
      responses:
        "200":
          description: Draft created.
          content:
            application/json:
              schema:
                type: object
  /raise-risks:
    post:
      operationId: raiseRisks
      summary: Evaluate a draft deal and surface risks with citations.
      description: >
        Compares the draft's promised timeline against comparable past deals and
        evaluates static risk rules. Returns an overall risk level, a headline
        (e.g. "60 days promised, history says 95"), ranked risks, cited
        comparables, and a suggested safer timeline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealRef"
      responses:
        "200":
          description: Risk report.
          content:
            application/json:
              schema:
                type: object
  /deep-research:
    post:
      operationId: deepResearch
      summary: Research features/offerings to propose for the deal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealRef"
      responses:
        "200":
          description: Feature recommendations and a research brief.
          content:
            application/json:
              schema:
                type: object
  /analyze-and-report:
    post:
      operationId: analyzeAndReport
      summary: Full Read-Check-Report pipeline; writes a PDF + review task to Box.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealRef"
      responses:
        "200":
          description: Report file id, review task, and full analysis.
          content:
            application/json:
              schema:
                type: object
components:
  schemas:
    DraftParams:
      type: object
      properties:
        customer: { type: string }
        vertical: { type: string }
        region: { type: string }
        signed_quarter: { type: string, enum: [Q1, Q2, Q3, Q4] }
        term_months: { type: integer }
        payment_terms: { type: string }
        sla_tier: { type: string }
        discount_pct: { type: number }
        promised_days: { type: integer }
        hw_vendor: { type: string }
        compliance_pack: { type: boolean }
        line_items:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              qty: { type: integer }
    DealRef:
      type: object
      description: >
        Either reference an existing contract by `contract_id`, or pass draft
        parameters (same as DraftParams) to analyze a new deal.
      properties:
        contract_id: { type: string }
        customer: { type: string }
        vertical: { type: string }
        region: { type: string }
        signed_quarter: { type: string }
        sla_tier: { type: string }
        promised_days: { type: integer }
        hw_vendor: { type: string }
        discount_pct: { type: number }
        line_items:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              qty: { type: integer }
